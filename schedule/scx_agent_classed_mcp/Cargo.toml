[package]
name = "scx_agent_classed_mcp"
version = "0.1.0"
edition = "2021"
description = "MCP provider for scx_agent_classed dynamic rules"
license = "GPL-2.0-only"
default-run = "scx_agent_classed_mcp"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
scx_agent_classed_control = { path = "../scx_agent_classed/control-api", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.6"
