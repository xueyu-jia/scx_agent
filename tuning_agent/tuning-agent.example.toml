[llm]
base_url = "http://127.0.0.1:7001"
api_key = "replace-me"
model = "gpt-5.5"
timeout_ms = 30000
retry_count = 3

[reasoning]
max_rounds = 6

[safety]
# Total monotonic elapsed-time budget for trusted A/B evaluation after commit is requested.
evaluation_timeout_ms = 600000
# Delay before accepting another activation after a recoverable episode outcome.
cooldown_ms = 30000

[activation]
socket_path = "/tmp/tuning-agent.sock"
# timer_interval_ms = 60000

[audit]
path = "logs/audit.jsonl"

[transaction]
wal_dir = "state/transactions"

[capabilities]
allowed_capabilities = []
denied_capabilities = []

# Each local mutation capability is bound to exactly one administrator-selected
# resource. The Agent sees only its `value` argument, never a target path.
# [[capabilities.local_mutations]]
# id = "local/vm-dirty-ratio"
# description = "Experiment with vm.dirty_ratio"
# kind = "sysctl"
# key = "vm.dirty_ratio"

[mcp]
enabled = true

